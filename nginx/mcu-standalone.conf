# ==============================================================================
# Nginx Configuration for FB-Service-Sheets (Non-Docker / VPS / Standalone)
# Target: Next.js running on 127.0.0.1:3020 via PM2 or systemd
# ==============================================================================

# Rate Limiting Zones (DDoS & Brute-force protection)
limit_req_zone $binary_remote_addr zone=mcu_general:10m rate=25r/s;
limit_req_zone $binary_remote_addr zone=mcu_api:10m rate=12r/s;
limit_req_zone $binary_remote_addr zone=mcu_auth:10m rate=4r/s;

# Upstream pointing to local Next.js instance
upstream mcu_app {
    server 127.0.0.1:3020;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with domain name e.g. buddhist.mcu.ac.th

    # Maximum payload size (Prevents memory exhaustion buffer overflow attacks)
    client_max_body_size 15M;

    # Security Headers at Web Server level
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off; # Hides Nginx version banner

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Rate limit on Authentication API (Anti-Brute Force)
    location /api/auth {
        limit_req zone=mcu_auth burst=6 nodelay;
        proxy_pass http://mcu_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate limit on general APIs
    location /api/ {
        limit_req zone=mcu_api burst=15 nodelay;
        proxy_pass http://mcu_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Assets Caching (_next/static)
    location /_next/static/ {
        proxy_pass http://mcu_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # General Web Application Traffic
    location / {
        limit_req zone=mcu_general burst=30 nodelay;
        proxy_pass http://mcu_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
